<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Idioms">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Idiom Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone-first single column (max 640px): header, view area (home / flashcards / quiz / list), sticky bottom actions.
   Same identity as the Idiom Rebus whiteboard game, single light theme on purpose. */
:root {
  --bg: #E9EEF5;
  --card: #FFFFFF;
  --ink: #14213D;
  --muted: #56627A;
  --line: #C9D2E0;
  --hi: #FFC93C;
  --hi-soft: #FFF1C7;
  --ok: #1F9E89;
  --bad: #E8513F;
  --f-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --f-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 4px solid #1E7FD0; outline-offset: 3px; }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 16px 40px; display: grid; gap: 16px; }

header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
header h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; margin: 0; line-height: 1; cursor: pointer; }
header h1 span { background: var(--hi); padding: 0 .2em; border-radius: 6px; }
.chip { font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 999px; border: 2px solid var(--ink); background: var(--card); }

.panel { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--ink); padding: 18px; display: grid; gap: 14px; min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; margin: 0; line-height: 1.1; text-wrap: balance; }
.label { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--muted); margin: 0; }
p { margin: 0; }

.units { display: flex; flex-wrap: wrap; gap: 8px; }
.units label { position: relative; }
.units input { position: absolute; inset: 0; opacity: 0; }
.units span { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 12px; font-weight: 700; font-size: .9rem; }
.units input:checked + span { background: var(--ink); color: #fff; }
.units input:focus-visible + span { outline: 4px solid #1E7FD0; outline-offset: 2px; }

.meter { height: 14px; border-radius: 999px; background: var(--bg); border: 2px solid var(--ink); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .4s; }
.stats { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.unitrows { display: grid; gap: 8px; }
.unitrow { display: grid; grid-template-columns: 9.5em 1fr 3.6em; gap: 10px; align-items: center; font-size: .9rem; font-variant-numeric: tabular-nums; }
.unitrow .meter { height: 10px; border-width: 1.5px; }
.unitrow b { text-align: right; }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.mode {
  text-align: left; border: 3px solid var(--ink); border-radius: 18px; background: var(--card); padding: 14px;
  box-shadow: 4px 4px 0 var(--ink); display: grid; gap: 4px; transition: transform .08s, box-shadow .08s;
}
.mode:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.mode strong { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; }
.mode small { color: var(--muted); font-size: .85rem; line-height: 1.3; }
.mode.primary { background: var(--hi); }
.mode:disabled { opacity: .45; cursor: default; }

.btn { min-height: 52px; border: 3px solid var(--ink); border-radius: 14px; background: var(--card); font-family: var(--f-display); font-size: 1.15rem; padding: 0 16px; box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--hi); }
.btn.good { background: var(--ok); color: #fff; }
.btn.again { background: var(--bad); color: #fff; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.link { background: none; border: 0; padding: 0; font-weight: 700; text-decoration: underline; color: var(--muted); }

.emoji { font-family: var(--f-emoji); font-size: clamp(2.1rem, 10vw, 3.3rem); line-height: 1.2; text-align: center; letter-spacing: .06em; word-break: break-word; }
.idiom { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.6rem, 7vw, 2.3rem); text-align: center; line-height: 1.1; text-wrap: balance; margin: 0; }
.prompt { text-align: center; font-weight: 700; font-size: 1.15rem; text-wrap: balance; }
.flash { min-height: 300px; align-content: center; justify-items: center; text-align: center; cursor: pointer; }
.back { display: grid; gap: 10px; text-align: left; justify-self: stretch; border-top: 3px dashed var(--line); padding-top: 12px; }
.ex { font-style: italic; }
.gap { display: inline-block; min-width: 4.5em; border-bottom: 4px solid var(--ink); background: var(--hi-soft); }

.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 3px solid var(--ink); border-radius: 14px; background: var(--card); padding: 12px 14px; font-weight: 700; display: flex; gap: 12px; align-items: center; min-height: 56px; }
.opt b { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; min-width: 1em; }
.opt.right { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt:disabled { cursor: default; }
.opt:disabled:not(.right):not(.wrong) { opacity: .55; }
.type { display: flex; gap: 8px; flex-wrap: wrap; }
.type input { flex: 1 1 220px; min-height: 52px; border: 3px solid var(--ink); border-radius: 14px; padding: 0 14px; font-weight: 700; min-width: 0; }
.letters { font-family: var(--f-display); letter-spacing: .12em; text-align: center; font-size: 1.3rem; color: var(--muted); }
.feedback { border-radius: 14px; padding: 12px 14px; font-weight: 700; display: grid; gap: 4px; }
.feedback.ok { background: #DDF3EE; }
.feedback.no { background: #FBE0DC; }
.qhead { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }
.dots i.ok { background: var(--ok); border-color: var(--ok); }
.dots i.no { background: var(--bad); border-color: var(--bad); }
.dots i.now { background: var(--hi); }

.big { font-family: var(--f-display); font-size: 3.4rem; text-align: center; line-height: 1; }
.list { display: grid; gap: 0; }
.item { padding: 12px 0; border-bottom: 2px solid var(--line); display: grid; gap: 4px; }
.item:last-child { border-bottom: 0; }
.item .t { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.item strong { font-size: 1.1rem; }
.item .e { font-family: var(--f-emoji); font-size: 1.3rem; }
.item .m { color: var(--muted); }
.search { min-height: 48px; border: 3px solid var(--ink); border-radius: 14px; padding: 0 14px; width: 100%; }
.box { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg); white-space: nowrap; }
.box.m { background: var(--ok); color: #fff; }


/* home */
.hero { background: var(--ink); color: #fff; border-radius: 26px; padding: 20px; display: grid; gap: 16px; box-shadow: 6px 6px 0 var(--hi); }
.hero-top { display: flex; gap: 14px; align-items: center; justify-content: space-between; }
.hello { font-weight: 700; color: var(--hi); font-size: .95rem; }
.hero h2 { color: #fff; font-size: 1.65rem; }
.ring { --p: 0; flex: 0 0 auto; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(closest-side, var(--ink) 74%, transparent 75% 100%), conic-gradient(var(--hi) calc(var(--p) * 1%), rgba(255,255,255,.18) 0); }
.ring b { font-family: var(--f-display); font-weight: 400; font-size: 1.9rem; line-height: 1; display: block; }
.ring small { font-size: .7rem; font-weight: 700; opacity: .8; display: block; }
.teaser { border: 2px dashed rgba(255,255,255,.35); background: rgba(255,255,255,.06); border-radius: 18px; padding: 14px 10px; display: grid; gap: 6px; color: #fff; }
.teaser .emoji { font-size: clamp(2rem, 10vw, 2.8rem); }
.teaser .tq { font-weight: 700; font-size: .95rem; color: var(--hi); min-height: 1.4em; }
.teaser .tq.ans { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; color: #fff; }
.cta { border: 0; border-radius: 16px; background: var(--hi); color: var(--ink); font-family: var(--f-display); font-size: 1.45rem; min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 5px 0 #C99A1B; }
.cta:active { transform: translateY(4px); box-shadow: 0 1px 0 #C99A1B; }
.cta small { font-family: var(--f-body); font-size: .85rem; font-weight: 700; opacity: .75; }
.cta:disabled { opacity: .5; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { border: 3px solid var(--ink); border-radius: 18px; background: var(--card); padding: 12px 6px; display: grid; justify-items: center; gap: 2px; box-shadow: 4px 4px 0 var(--ink); }
.tile:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.tile .ti { font-family: var(--f-emoji); font-size: 1.8rem; line-height: 1.2; }
.tile strong { font-family: var(--f-display); font-weight: 400; font-size: 1.05rem; }
.tile small { font-size: .75rem; color: var(--muted); font-weight: 700; }
.tile:disabled { opacity: .45; }
.utiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.utile { position: relative; }
.utile input { position: absolute; opacity: 0; inset: 0; }
.utile span { display: grid; gap: 6px; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--card); }
.utile span b { display: flex; justify-content: space-between; font-size: .9rem; }
.utile span em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--muted); }
.utile .meter { height: 8px; border-width: 1.5px; }
.allu { border: 0; padding: 0; background: none; text-align: left; font: inherit; }
.allu > span { border-style: dashed !important; opacity: 1 !important; }
.utile input:checked + span { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.utile input:not(:checked) + span { opacity: .45; }
.utile input:focus-visible + span { outline: 4px solid #1E7FD0; outline-offset: 2px; }
.me { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.wrap.wide { max-width: 1040px; }
.field { display: grid; gap: 4px; flex: 1 1 180px; }
.field input, .codebox, textarea { min-height: 48px; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 700; width: 100%; min-width: 0; background: var(--card); }
.codebox { font-family: ui-monospace, Consolas, monospace; font-size: .95rem; word-break: break-all; user-select: all; background: var(--hi-soft); }
textarea { min-height: 120px; font-family: ui-monospace, Consolas, monospace; font-weight: 400; font-size: .9rem; resize: vertical; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 8px; border-bottom: 2px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
td.num, th.num { text-align: right; }
td .meter { width: 120px; display: inline-block; vertical-align: middle; height: 12px; }
tr.top1 td:first-child, tr.top2 td:first-child, tr.top3 td:first-child { font-family: var(--f-display); font-size: 1.3rem; }
.note { font-size: .85rem; color: var(--muted); }
@media (max-width: 420px) { .modes { grid-template-columns: 1fr; } .unitrow { grid-template-columns: 7.5em 1fr 3.2em; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

const IRR = { buried: "bury", ran: "run", stole: "steal", broke: "break", went: "go", took: "take", sang: "sing", won: "win", kept: "keep", made: "make", came: "come", got: "get", is: "be", are: "be", was: "be", were: "be", "'s": "be", wined: "wine", dined: "dine", runs: "run", running: "run" };
const POSS = new Set(["your", "my", "his", "her", "their", "its", "our", "one's"]);
function norm(w) { w = w.toLowerCase().replace(/[^a-z']/g, ""); return IRR[w] || w; }
function same(aw, tw) {
  aw = aw.toLowerCase();
  if (POSS.has(aw)) return POSS.has(tw);
  if (aw.startsWith("some")) return true;
  aw = norm(aw);
  if (aw === tw) return true;
  if (aw.length <= 3) return tw.startsWith(aw) && tw.length <= aw.length + 3;
  return aw.slice(0, 4) === tw.slice(0, 4);
}
function gapSpan(a, ex) {
  let aw = a.split(" ");
  if (aw[0].toLowerCase() === "be" && aw.length > 2) aw = aw.slice(1);
  const re = /[A-Za-z'’-]+/g; const toks = []; let m;
  while ((m = re.exec(ex))) toks.push({ w: norm(m[0].replace("’", "'")), s: m.index, e: m.index + m[0].length });
  for (let i = 0; i < toks.length; i++) {
    let ok = true;
    for (let j = 0; j < aw.length; j++) { if (!toks[i + j] || !same(aw[j], toks[i + j].w)) { ok = false; break; } }
    if (ok) return [toks[i].s, toks[i + aw.length - 1].e];
  }
  return null;
}

/* progress codes: students send them to the teacher, the teacher pastes them into the scoreboard */
const SALT = "burlington-skills-2";
function hash(str) { let h = 2166136261; for (const ch of str + SALT) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; } return h.toString(36).padStart(7, "0").slice(-6); }
const b64 = str => btoa(String.fromCharCode(...new TextEncoder().encode(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)));
function makeCode() {
  const body = b64(JSON.stringify({ n: P.name, g: P.group, u: UNITS.map(([v]) => mastered(BOOK.filter(x => x.u === v))), q: P.quizzes, c: P.correct, t: Math.floor(Date.now() / 60000) }));
  return `IDT1.${body}.${hash(body)}`;
}
function readCodes(text) {
  const out = [];
  for (const m of text.matchAll(/IDT1\.([A-Za-z0-9_-]+)\.([a-z0-9]{6})/g)) {
    if (hash(m[1]) !== m[2]) continue;
    try { const d = JSON.parse(unb64(m[1])); if (d && typeof d.n === "string" && Array.isArray(d.u)) out.push(d); } catch (e) {}
  }
  return out;
}

function norm(s) {
  return s.toLowerCase().replace(/[’']/g, "'").replace(/\b(my|his|her|their|its|our|one's)\b/g, "your")
    .replace(/[^a-z' ]/g, " ").replace(/\s+/g, " ").trim();
}

  const utiles = UNITS.map(([v, name]) => { const l = BOOK.filter(x => x.u === v), mm = mastered(l);
    return `<label class="utile"><input type="checkbox" id="u${v}" value="${v}" ${P.units.includes(v) ? "checked" : ""}><span><b>${name}<em>${mm}/${l.length}</em></b><span class="meter" style="display:block;padding:0;border-radius:999px"><i style="width:${l.length ? mm / l.length * 100 : 0}%"></i></span></span></label>`; }).join("");
  const todo = p.filter(x => box(x) < MASTER), tease = (todo.length ? todo : p)[Math.floor(Math.random() * Math.max(1, (todo.length ? todo : p).length))];
  $("view").innerHTML = `
  <div style="display:grid;gap:16px">
    <section class="hero">
      <div class="hero-top">
        <div style="display:grid;gap:4px"><p class="hello">${first ? `Hi, ${first}!` : "Hi there!"}</p><h2>${m === p.length && p.length ? "You've mastered them all!" : "Learn the idioms before the big game"}</h2></div>
        <div class="ring" style="--p:${pct}" aria-label="${m} of ${p.length} mastered"><div><b>${m}</b><small>of ${p.length}<br>mastered</small></div></div>
      </div>
      ${tease ? `<button class="teaser" type="button" id="teaser"><span class="emoji">${tease.c}</span><span class="tq" id="tq">Can you guess it? Tap to check</span></button>` : ""}
      <button class="cta" type="button" id="goQuiz" ${p.length ? "" : "disabled"}>Start a quiz <small>10 questions</small></button>
    </section>
    <section class="tiles">
      <button class="tile" type="button" id="goCards" ${p.length ? "" : "disabled"}><span class="ti">🃏</span><strong>Flashcards</strong><small>${p.length} cards</small></button>
      <button class="tile" type="button" id="goMiss" ${P.miss.length ? "" : "disabled"}><span class="ti">🔁</span><strong>Mistakes</strong><small>${P.miss.length} to review</small></button>
      <button class="tile" type="button" id="goList"><span class="ti">📖</span><strong>Word list</strong><small>Search</small></button>
    </section>
    <section class="panel">
      <div class="me"><p class="label">Your units</p><p class="note">Tap a unit to add or remove it</p></div>
      <div class="utiles" id="units">${utiles}<button class="utile allu" type="button" id="allUnits"><span><b>${P.units.length === UNITS.length ? "Clear all" : "All units"}<em>${BOOK.length}</em></b><span class="note" style="font-size:.75rem">${P.units.length === UNITS.length ? "Start from one unit" : "Study everything"}</span></span></button></div>
      <p class="note">An idiom is mastered when you get it right ${MASTER} times in a row. Progress is saved on this phone. <button class="link" type="button" id="reset">Start again from zero</button></p>
    </section>
    <section class="panel">
      <p class="label">Class scoreboard</p>
      ${P.name ? `<div class="me"><p><b>${esc(P.name)}</b>${P.group ? ` · ${esc(P.group)}` : ""}</p><button class="link" type="button" id="rename">Change name</button></div>
        <button class="btn primary" type="button" id="send">Send my progress to my teacher</button>`
      : `<p>Write your name so your teacher can put you on the class scoreboard.</p>
        <form class="row" id="nameForm"><div class="field"><label class="label" for="nm">Name and surname</label><input id="nm" maxlength="40" autocomplete="name" required></div>
        <div class="field" style="flex:0 1 110px"><label class="label" for="gr">Group</label><input id="gr" maxlength="10" placeholder="2º B"></div>
        <button class="btn primary" style="align-self:end">Save</button></form>`}
    </section>
    <p class="note" style="text-align:center">Teacher? <button class="link" type="button" id="goTeacher">Open the class scoreboard</button></p>
  </div>`;
  $("allUnits").onclick = () => { P.units = P.units.length === UNITS.length ? [] : UNITS.map(u => u[0]); save(); home(); };
  $("units").addEventListener("change", () => { P.units = UNITS.map(u => u[0]).filter(v => $("u" + v).checked); save(); home(); });
  if (tease) $("teaser").onclick = () => { const t = $("tq"); if (t.classList.contains("ans")) home(); else { t.textContent = tease.a; t.classList.add("ans"); } };
  $("goCards").onclick = () => cards();
  $("goQuiz").onclick = () => quiz(pickQuiz(pool(), 10));
  $("goMiss").onclick = () => quiz(shuffle(BOOK.filter(x => P.miss.includes(x.a))).slice(0, 10));
  $("goList").onclick = () => list();
  $("goTeacher").onclick = () => teacher();
  if (P.name) { $("send").onclick = send; $("rename").onclick = () => { P.name = ""; save(); home(); }; }
  else $("nameForm").onsubmit = e => { e.preventDefault(); const n = $("nm").value.trim(); if (!n) return; P.name = n; P.group = $("gr").value.trim(); save(); home(); };
  $("reset").onclick = e => {
    if (e.target.dataset.sure) { P.box = {}; P.miss = []; P.quizzes = 0; P.correct = 0; save(); home(); }
    else { e.target.dataset.sure = "1"; e.target.textContent = "Tap again to delete your progress"; }
  };
  scrollTo(0, 0);
}

/* ---------- flashcards ---------- */
function cards() {
  const deck = shuffle(pool()).sort((a, b) => box(a) - box(b));
  let i = 0, open = false;
  function draw() {
    if (i >= deck.length) { $("view").innerHTML = `<section class="panel" style="text-align:center"><h2>You've seen all ${deck.length} cards</h2><p>Now test yourself with the quiz.</p><div class="row"><button class="btn primary" id="q">Start the quiz</button><button class="btn" id="h">Home</button></div></section>`;
      $("q").onclick = () => quiz(pickQuiz(pool(), 10)); $("h").onclick = home; return; }
    const it = deck[i];
    $("view").innerHTML = `
    <div style="display:grid;gap:14px">
      <div class="qhead"><span>Card ${i + 1} of ${deck.length}</span><span class="chip">${UNIT_NAME[it.u]}</span></div>
      <section class="panel flash" id="card" role="button" tabindex="0" aria-label="Show meaning">
        <div class="emoji">${it.c}</div>
        <p class="idiom">${esc(it.a)}</p>
        ${open ? `<div class="back"><div><p class="label">Meaning</p><p>${esc(it.m)}</p></div><div><p class="label">Example</p><p class="ex">${esc(it.ex)}</p></div></div>`
               : `<p style="color:var(--muted);font-weight:700">Tap the card to see the meaning</p>`}
      </section>
      <div class="row">${open ? `<button class="btn again" id="again">Not yet</button><button class="btn good" id="got">I know it</button>` : `<button class="btn primary" id="flip">Show meaning</button>`}</div>
      <button class="link" type="button" id="h">Back to home</button>
    </div>`;
    const flip = () => { open = true; draw(); };
    $("card").onclick = () => { if (!open) flip(); };
    $("card").onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && !open) { e.preventDefault(); flip(); } };
    if (open) {
      $("again").onclick = () => { setBox(it, 0); i++; open = false; draw(); };
      $("got").onclick = () => { if (box(it) === 0) setBox(it, 1); i++; open = false; draw(); };
    } else $("flip").onclick = flip;
    $("h").onclick = home;
  }
  draw(); scrollTo(0, 0);
}

/* ---------- quiz ---------- */
function pickQuiz(p, n) {
  return shuffle(p).sort((a, b) => box(a) - box(b)).slice(0, n);
}
const TYPES = ["emoji", "meaning", "gap", "reverse", "type"];
function makeQ(it, k) {
  const type = it.forceType || TYPES[(k + Math.floor(Math.random() * TYPES.length)) % TYPES.length];
  const others = shuffle(BOOK.filter(x => x.a !== it.a && x.m !== it.m)).slice(0, 3);
  const opts = shuffle([it, ...others]);
  return { it, type, opts };
}
function quiz(items) {
  if (!items.length) return home();
  const qs = items.map((it, k) => makeQ(it, k));
  let i = 0, results = [];
  function draw(answered, chosen, okFlag) {
    const q = qs[i], it = q.it;
    const span = gapSpan(it.a, it.ex);
    const gapped = span ? `${esc(it.ex.slice(0, span[0]))}<span class="gap">&nbsp;</span>${esc(it.ex.slice(span[1]))}` : esc(it.ex);
    let ask;
    if (q.type === "emoji") ask = `<p class="prompt">Which idiom do the emojis show?</p><div class="emoji">${it.c}</div>`;
    else if (q.type === "meaning") ask = `<p class="prompt">Which idiom means…</p><p class="idiom" style="font-family:var(--f-body);font-weight:700;font-size:1.35rem">“${esc(it.m)}”</p>`;
    else if (q.type === "gap") ask = `<p class="prompt">Which idiom completes the sentence?</p><p style="font-size:1.25rem;text-align:center;font-weight:700">${gapped}</p>`;
    else if (q.type === "reverse") ask = `<p class="prompt">What does this idiom mean?</p><p class="idiom">${esc(it.a)}</p>`;
    else ask = `<p class="prompt">Write the idiom</p><div class="emoji">${it.c}</div><p class="letters">${it.a.split(" ").map(w => w[0].toUpperCase() + "_".repeat(Math.max(0, [...w].filter(c => /\p{L}/u.test(c)).length - 1))).join("  ")}</p><p style="text-align:center;color:var(--muted)">${esc(it.m)}</p>`;

    let answer;
    if (q.type === "type") {
      answer = `<form class="type" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the idiom" ${answered ? "disabled" : ""} value="${answered ? esc(chosen) : ""}"><button class="btn primary" ${answered ? "disabled" : ""}>Check</button></form>`;
    } else {
      answer = `<div class="opts">${q.opts.map((o, n) => {
        const text = q.type === "reverse" ? o.m : o.a;
        let cls = "";
        if (answered && o.a === it.a) cls = "right"; else if (answered && chosen === o.a) cls = "wrong";
        return `<button class="opt ${cls}" type="button" data-o="${n}" ${answered ? "disabled" : ""}><b>${"ABCD"[n]}</b><span>${esc(text)}</span></button>`; }).join("")}</div>`;
    }
    const fb = answered ? `<div class="feedback ${okFlag ? "ok" : "no"}"><span>${okFlag ? "Correct!" : `Not quite. The answer is: ${esc(it.a)}`}</span><span style="font-weight:400">${esc(it.m)}</span><span class="ex" style="font-weight:400">${esc(it.ex)}</span></div>
      <button class="btn primary" id="next">${i === qs.length - 1 ? "See my score" : "Next question"}</button>` : "";
    const dots = qs.map((_, n) => `<i class="${n < results.length ? (results[n] ? "ok" : "no") : n === i ? "now" : ""}"></i>`).join("");
    $("view").innerHTML = `
    <div style="display:grid;gap:14px">
      <div class="qhead"><span>Question ${i + 1} of ${qs.length}</span><span class="dots">${dots}</span></div>
      <section class="panel">${ask}${answer}${fb}</section>
      <button class="link" type="button" id="h">Stop and go home</button>
    </div>`;
    $("h").onclick = home;
    if (answered) { $("next").onclick = () => { i++; i < qs.length ? draw(false) : end(); }; $("next").focus(); return; }
    if (q.type === "type") {
      $("ti").focus();
      $("tf").onsubmit = e => { e.preventDefault(); const v = $("ti").value; if (!v.trim()) return; mark(norm(v) === norm(it.a), v); };
    } else {
      document.querySelectorAll("[data-o]").forEach(b => b.onclick = () => { const o = q.opts[+b.dataset.o]; mark(o.a === it.a, o.a); });
    }
    function mark(ok, chosen) {
      results.push(ok);
      if (ok) P.correct++;
      if (ok) { setBox(it, box(it) + 1); P.miss = P.miss.filter(a => a !== it.a); }
      else { setBox(it, 0); if (!P.miss.includes(it.a)) P.miss.push(it.a); }
      save(); draw(true, chosen, ok);
    }
  }
  function end() {
    P.quizzes++; save();
    const right = results.filter(Boolean).length;
    const wrong = qs.filter((q, n) => !results[n]).map(q => q.it);
    const msg = right === qs.length ? "Perfect score!" : right >= qs.length * .7 ? "Great work!" : right >= qs.length * .4 ? "Keep going!" : "Study the cards and try again.";
    $("view").innerHTML = `
    <section class="panel" style="text-align:center">
      <p class="label">Your score</p>
      <p class="big">${right}/${qs.length}</p>
      <h2>${msg}</h2>
      ${wrong.length ? `<div class="list" style="text-align:left"><p class="label">Review these</p>${wrong.map(it => `<div class="item"><div class="t"><strong>${esc(it.a)}</strong><span class="e">${it.c}</span></div><span class="m">${esc(it.m)}</span></div>`).join("")}</div>` : ""}
      <div class="row">${wrong.length ? `<button class="btn primary" id="rm">Practise my mistakes</button>` : ""}<button class="btn ${wrong.length ? "" : "primary"}" id="again">New quiz</button><button class="btn" id="h">Home</button></div>
    </section>`;
    if (wrong.length) $("rm").onclick = () => quiz(shuffle(wrong));
    $("again").onclick = () => quiz(pickQuiz(pool(), 10));
    $("h").onclick = home;
    scrollTo(0, 0);
  }
  draw(false); scrollTo(0, 0);
}

/* ---------- word list ---------- */
function list() {
  const p = pool();
  $("view").innerHTML = `
  <section class="panel">
    <h2>Word list</h2>
    <input class="search" id="q" type="search" placeholder="Search an idiom or a word in the meaning" aria-label="Search">
    <div class="list" id="items"></div>
    <button class="link" type="button" id="h">Back to home</button>
  </section>`;
  const render = () => {
    const t = norm($("q").value);
    const rows = UNITS.filter(([v]) => P.units.includes(v)).map(([v, name]) => {
      const l = p.filter(x => x.u === v && (!t || norm(x.a + " " + x.m).includes(t)));
      if (!l.length) return "";
      return `<p class="label" style="margin-top:14px">${name}</p>` + l.map(it => `<div class="item"><div class="t"><strong>${esc(it.a)}</strong><span class="box ${box(it) >= MASTER ? "m" : ""}">${box(it) >= MASTER ? "Mastered" : box(it) + "/" + MASTER}</span></div><span class="e">${it.c}</span><span class="m">${esc(it.m)}</span><span class="ex">${esc(it.ex)}</span></div>`).join("");
    }).join("");
    $("items").innerHTML = rows || `<p style="color:var(--muted)">No idioms match your search.</p>`;
  };
  $("q").oninput = render; render();
  $("h").onclick = home;
  scrollTo(0, 0);
}

/* ---------- send progress ---------- */
function send() {
  const code = makeCode(), total = mastered(BOOK);
  $("view").innerHTML = `
  <section class="panel">
    <h2>Your progress code</h2>
    <p><b>${esc(P.name)}</b>${P.group ? ` · ${esc(P.group)}` : ""} · ${total}/${BOOK.length} idioms mastered · ${P.quizzes} quizzes</p>
    <div class="codebox" id="code">${code}</div>
    <button class="btn primary" type="button" id="copy">Copy the code</button>
    <p id="copied" class="note" aria-live="polite"></p>
    <p>Paste it where your teacher tells you: Google Classroom, a form or an email. The code changes every time you study, so send a new one before the game.</p>
    <button class="link" type="button" id="h">Back to home</button>
  </section>`;
  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(code); $("copied").textContent = "Copied. Now paste it for your teacher."; }
    catch (e) { const r = document.createRange(); r.selectNodeContents($("code")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $("copied").textContent = "The code is selected: copy it with your device's Copy option."; }
  };
  $("h").onclick = home; scrollTo(0, 0);
}

/* ---------- teacher scoreboard (kept in this browser) ---------- */
const TKEY = "idiomTrainer.class.v1";
function loadClass() { try { return JSON.parse(localStorage.getItem(TKEY) || "{}"); } catch (e) { return {}; } }
function saveClass(c) { try { localStorage.setItem(TKEY, JSON.stringify(c)); } catch (e) {} }
function teacher(filter) {
  document.querySelector(".wrap").classList.add("wide");
  const cls = loadClass();
  const rows = Object.values(cls).filter(r => !filter || r.g === filter)
    .map(r => ({ ...r, total: r.u.reduce((a, b) => a + b, 0) }))
    .sort((a, b) => b.total - a.total || b.c - a.c || a.n.localeCompare(b.n));
  const groups = [...new Set(Object.values(cls).map(r => r.g).filter(Boolean))].sort();
  const when = t => new Date(t * 60000).toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  $("view").innerHTML = `
  <div style="display:grid;gap:16px">
    <section class="panel">
      <h2>Class scoreboard</h2>
      <p>Ask each student to tap <b>Send my progress</b> and send you the code (for example as a Classroom private comment or a Google Form answer). Paste the codes here: one or many at a time, even a whole column copied from a spreadsheet. A newer code from the same student replaces the old one.</p>
      <label class="label" for="codes">Progress codes</label>
      <textarea id="codes" placeholder="IDT1.…"></textarea>
      <div class="row"><button class="btn primary" type="button" id="add">Add to the scoreboard</button></div>
      <p id="msg" class="note" aria-live="polite"></p>
    </section>
    <section class="panel">
      <div class="row" style="align-items:center;justify-content:space-between">
        <p class="label">${rows.length} student${rows.length === 1 ? "" : "s"} · ${BOOK.length} idioms in the book</p>
        ${groups.length > 1 ? `<div class="units" id="grp"><label><input type="radio" name="g" value="" ${!filter ? "checked" : ""}><span>All</span></label>${groups.map(g => `<label><input type="radio" name="g" value="${esc(g)}" ${filter === g ? "checked" : ""}><span>${esc(g)}</span></label>`).join("")}</div>` : ""}
      </div>
      ${rows.length ? `<div class="scroll"><table>
        <thead><tr><th>#</th><th>Student</th><th>Group</th><th>Mastered</th>${UNITS.map(([v]) => `<th class="num">${v === "GS" ? "GS" : v.replace("U", "U")}</th>`).join("")}<th class="num">Quizzes</th><th class="num">Right answers</th><th>Updated</th></tr></thead>
        <tbody>${rows.map((r, n) => `<tr class="top${n + 1}"><td>${n + 1}</td><td><b>${esc(r.n)}</b></td><td>${esc(r.g || "")}</td>
          <td><span class="meter"><i style="width:${r.total / BOOK.length * 100}%"></i></span> <b>${r.total}</b></td>
          ${r.u.map(x => `<td class="num">${x}</td>`).join("")}<td class="num">${r.q}</td><td class="num">${r.c}</td><td>${when(r.t)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="note">GS = Getting Started, U1–U6 = units. Ranking: idioms mastered, then right answers.</p>`
      : `<p class="note">No students yet. Paste the first progress codes above.</p>`}
      <p class="note">The scoreboard is saved in this browser. <button class="link" type="button" id="clear">Delete the scoreboard</button></p>
    </section>
    <button class="link" type="button" id="h">Back to the student view</button>
  </div>`;
  $("add").onclick = () => {
    const found = readCodes($("codes").value);
    if (!found.length) { $("msg").textContent = "No valid codes found. Check that the whole code was copied, starting with IDT1."; return; }
    const c = loadClass(); let added = 0;
    for (const d of found) { const k = (d.n.trim() + "|" + (d.g || "").trim()).toLowerCase(); if (!c[k] || c[k].t <= d.t) { c[k] = d; added++; } }
    saveClass(c); teacher(filter); $("msg").textContent = `${found.length} code${found.length === 1 ? "" : "s"} read, ${added} added or updated.`;
  };
  if ($("grp")) $("grp").onchange = e => teacher(e.target.value || undefined);
  $("clear").onclick = e => { if (e.target.dataset.sure) { saveClass({}); teacher(); } else { e.target.dataset.sure = "1"; e.target.textContent = "Tap again to delete every student"; } };
  $("h").onclick = home; scrollTo(0, 0);
}

$("homeLink").onclick = home;
home();
</script>
